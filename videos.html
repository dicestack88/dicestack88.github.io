<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos - Dicestack88 Darklands</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">Dicestack88 Darklands</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="videos.html">Videos</a>
      <a href="socials.html">Socials</a>
      <a href="clients.html">Clients</a>
      <a href="about.html">About</a>
      <a href="resourcepacks.html">Resource Packs</a>
    </nav>
    <button id="themeToggle" class="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle dark/light mode">🌙</button>
  </header>

  <!-- Animated Background -->
  <div class="animated-bg">
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
  </div>

  <!-- Page Content -->
  <div class="page">
    <h1>Latest Videos</h1>
    <p>Live uploads from <a class="inline-link" href="https://www.youtube.com/@dicestack88" target="_blank" rel="noopener noreferrer">youtube.com/@dicestack88</a>. No API key needed.</p>

    <!-- Filter Controls -->
    <div class="filter-controls">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="video">Videos</button>
      <button class="filter-btn" data-filter="short">Shorts</button>
    </div>

    <p id="videosStatus" class="videos-status" aria-live="polite">Loading the YouTube player…</p>

    <section class="youtube-embed-panel" aria-label="Dicestack88 YouTube videos">
      <div class="youtube-frame-wrap">
        <iframe
          id="videosFrame"
          title="All uploads from @dicestack88"
          src="about:blank"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          loading="lazy">
        </iframe>
      </div>
      <div class="youtube-actions">
        <a id="openFilterLink" class="channel-link" href="https://www.youtube.com/@dicestack88/videos" target="_blank" rel="noopener noreferrer">Open All uploads on YouTube</a>
        <a class="inline-link" href="https://www.youtube.com/@dicestack88" target="_blank" rel="noopener noreferrer">Visit the channel</a>
      </div>
    </section>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 Dicestack88</p>
  </footer>

  <script src="theme.js"></script>
  <script src="videos.js"></script>
</body>
</html>
